[package]
name = "factlite-cli"
description = "Command-line interface for the Factlite library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "factlite"
path = "src/main.rs"
# CLI usage lives in README; rustdoc would collide with the library's name.
doc = false

[dependencies]
factlite = { path = "../factlite" }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
workspace = true
