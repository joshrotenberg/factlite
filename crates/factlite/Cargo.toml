[package]
name = "factlite"
description = "Typed facts and durable revision-pinned database views over SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
serde = "1"
serde_json = "1"
base64 = "0.22"
tempfile = "3"

[dev-dependencies]
proptest = "1.9"
rusqlite = { version = "0.40", features = ["hooks"] }

[lints]
workspace = true
