[package]
name = "factlite"
description = "Typed facts and durable revision-pinned database views over SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1.9"
tempfile = "3"

[lints]
workspace = true
