[package]
name = "factlite-rpc"
description = "JSON-RPC 2.0 and MCP stdio servers for the Factlite library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "factlite-rpc"
path = "src/bin/factlite-rpc.rs"
# Usage lives in docs/rpc.md; rustdoc would collide with the library's name.
doc = false

[[bin]]
name = "factlite-mcp"
path = "src/bin/factlite-mcp.rs"
# Usage lives in docs/mcp.md.
doc = false

[dependencies]
factlite = { path = "../factlite" }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
assert_cmd = "2"
proptest = "1.9"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
